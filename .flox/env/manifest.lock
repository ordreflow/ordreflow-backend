    "vars": {
      "DB_HOST": "127.0.0.1",
      "DB_NAME": "ordreflow",
      "DB_PASSWORD": "",
      "DB_PORT": "5432",
      "DB_USERNAME": "ordreflow",
      "PGDATABASE": "ordreflow",
      "PGHOST": "127.0.0.1",
      "PGPORT": "5432",
      "PGUSER": "ordreflow"
    },
    "hook": {
      "on-activate": "if [ -z \"${ORDREFLOW_PGDATA:-}\" ] || [ ! -d \"$ORDREFLOW_PGDATA\" ]; then\n  export ORDREFLOW_PGDATA=\"$(mktemp -d \"${TMPDIR:-/tmp}/ordreflow-postgres.XXXXXX\")\"\n  initdb -D \"$ORDREFLOW_PGDATA\" --username=\"$DB_USERNAME\" --auth=trust >/dev/null\nfi\n",
      "on-deactivate": "if [ -n \"${ORDREFLOW_PGDATA:-}\" ] && [ -d \"$ORDREFLOW_PGDATA\" ]; then\n  rm -rf \"$ORDREFLOW_PGDATA\"\nfi\n"
    },
    "options": {},
    "services": {
      "auto-start": true,
      "postgres": {
        "command": "bash tools/start-flox-postgres.sh"
      }
    }
  },
