
name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - dev
      - main

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish backend images
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    env:
      IMAGE_TAG: ${{ github.event.workflow_run.head_branch }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set image names
        run: |
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')

          echo "API_IMAGE=ghcr.io/$OWNER/ordreflow-api" >> "$GITHUB_ENV"
          echo "MIGRATIONS_IMAGE=ghcr.io/$OWNER/ordreflow-migrations" >> "$GITHUB_ENV"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build the API runtime image
      - name: Build API image
        run: |
          docker build \
            --file Dockerfile \
            --target final \
            --tag "$API_IMAGE:$IMAGE_TAG" .

      # Build the migrations image
      - name: Build migrations image
        run: |
          docker build \
            --file Dockerfile \
            --target migration \
            --tag "$MIGRATIONS_IMAGE:$IMAGE_TAG" .

      # Push both images to GHCR
      - name: Push API image
        run: docker push "$API_IMAGE:$IMAGE_TAG"

      - name: Push migrations image
        run: docker push "$MIGRATIONS_IMAGE:$IMAGE_TAG"
