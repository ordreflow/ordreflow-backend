
name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish backend images
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        (
          github.event.workflow_run.head_branch == 'dev' ||
          github.event.workflow_run.head_branch == 'main'
        )}}
    runs-on: ubuntu-latest
 
    env:
      IMAGE_TAG: ${{ github.event.workflow_run.head_branch }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set image names
        run: |
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')

          echo "API_IMAGE=ghcr.io/$OWNER/ordreflow-api" >> "$GITHUB_ENV"
          echo "MIGRATIONS_IMAGE=ghcr.io/$OWNER/ordreflow-migrations" >> "$GITHUB_ENV"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build API runtime image
      - name: Build API image
        run: |
          docker build \
            --file Dockerfile \
            --target final \
            --tag "$API_IMAGE:$IMAGE_TAG" .

      # Build migrations image
      - name: Build migrations image
        run: |
          docker build \
            --file Dockerfile \
            --target migration \
            --tag "$MIGRATIONS_IMAGE:$IMAGE_TAG" .

      # Push API image
      - name: Push API image
        run: |
          for attempt in 1 2 3; do
            if docker push "$API_IMAGE:$IMAGE_TAG"; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "API image push failed; retrying in 10 seconds (attempt $((attempt + 1)) of 3)."
              sleep 10
            fi
          done

          exit 1

      # Push migrations image
      - name: Push migrations image
        run: |
          for attempt in 1 2 3; do
            if docker push "$MIGRATIONS_IMAGE:$IMAGE_TAG"; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Migrations image push failed; retrying in 10 seconds (attempt $((attempt + 1)) of 3)."
              sleep 10
            fi
          done

          exit 1
 
